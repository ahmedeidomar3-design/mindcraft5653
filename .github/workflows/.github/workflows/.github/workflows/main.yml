name: Minecraft Bot 24/7
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/15 * * * *' # السطر ده بيخلي البوت يصحى كل 15 دقيقة لوحده

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: node index.js
